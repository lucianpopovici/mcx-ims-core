[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/lucianpopovici/mcx-ims-core"
version = "0.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "time"] }
release = { path = "crates/release" }
binding = { path = "crates/binding" }
config = { path = "crates/config" }
sip = { path = "crates/sip" }
diameter = { path = "crates/diameter" }

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
debug = "line-tables-only"
